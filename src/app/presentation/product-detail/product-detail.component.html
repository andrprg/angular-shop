<div class="container" [ngClass]="{
    'container-xsmall': (layoutType$ | async) === breakpoints.XSmall
}">
    <div class="container__image">
        <img mat-card-image [src]="(product$ | async)?.imageUrl | hostUrl" alt="">
    </div>
    <div class="container__info" *ngIf="(product$ | async) as product">
        <h1>{{product?.title}}</h1>
        <div class="container__description counter__label">{{product?.description}}</div>
        <app-rating class="container__rating container__field" [product]="product"></app-rating>
        <mat-divider></mat-divider>
        <div class="container__field">{{product?.price | rub}}</div>
        <mat-divider></mat-divider>
        <div class="container__counter-label">
            <span class="counter__label">Количество:</span>
            <app-product-counter [product]="product"></app-product-counter>
        </div>
        <mat-divider></mat-divider>
        <button class="container__btn-add" mat-flat-button color="primary" (click)="onAddToCart(product)">Добавить в корзину</button>
    </div>
</div>
