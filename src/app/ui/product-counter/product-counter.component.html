<div class="counter" *ngIf="product">
    <button class="counter__minus counter__btn" (click)="decrement()">
        <mat-icon fontIcon="remove"></mat-icon>
    </button>
    <span class="counter__value">{{productCount}}</span>
    <button class="counter__plus counter__btn" (click)="increment()"
        [disabled]="productCount >= product.availableQuantity">
        <mat-icon fontIcon="add"></mat-icon>
    </button>
</div>
